name: Build (full MLX)

on:
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  macos-mlx:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: bash Scripts/fetch-llama-mtmd.sh build/llama-mtmd
      - name: Build Octoshot with mlx-swift-lm
        run: |
          set -o pipefail
          DERIVED="$PWD/.derivedData-mlx"
          XCBUILD=(xcodebuild -derivedDataPath "$DERIVED" -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO -skipPackagePluginValidation)
          # Build CLI before the app (same as Build workflow) to avoid a race on GeneratedAssetSymbols.swift.
          "${XCBUILD[@]}" -scheme octoshot -configuration Debug build
          "${XCBUILD[@]}" -scheme Octoshot -configuration Debug build
        env:
          NSUnbufferedIO: "YES"
