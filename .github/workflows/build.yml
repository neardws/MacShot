name: Build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  macos-build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build Octoshot
        run: |
          set -o pipefail
          xcodebuild \
            -scheme Octoshot \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
        env:
          NSUnbufferedIO: "YES"

      - name: Verify embedded CLI helper
        run: |
          set -euo pipefail
          APP_PATH=$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*/Build/Products/Debug/Octoshot.app' -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Octoshot.app not found in DerivedData"
            exit 1
          fi
          CLI="$APP_PATH/Contents/Helpers/octoshot"
          test -f "$CLI"
          test -x "$CLI"
          "$CLI" --help
          echo "Verified: $CLI --help"
