name: Build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  macos-build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build MacShot
        run: |
          set -o pipefail
          xcodebuild \
            -scheme MacShot \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
        env:
          NSUnbufferedIO: "YES"
