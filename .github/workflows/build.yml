name: Build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  macos-build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build Octoshot
        run: |
          set -o pipefail
          DERIVED="$PWD/.derivedData"
          xcodebuild \
            -derivedDataPath "$DERIVED" \
            -scheme octoshot \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
          xcodebuild \
            -derivedDataPath "$DERIVED" \
            -scheme Octoshot \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
          xcodebuild \
            -derivedDataPath "$DERIVED" \
            -scheme OctoshotCoreTests \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            test
        env:
          NSUnbufferedIO: "YES"

      - name: Verify embedded CLI helper
        run: |
          set -euo pipefail
          APP_PATH="$PWD/.derivedData/Build/Products/Debug/Octoshot.app"
          if [ -z "$APP_PATH" ]; then
            echo "Octoshot.app not found in DerivedData"
            exit 1
          fi
          CLI="$APP_PATH/Contents/Helpers/octoshot"
          test -f "$CLI"
          test -x "$CLI"
          "$CLI" --help
          echo "Verified: $CLI --help"
