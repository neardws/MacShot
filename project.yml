name: MacShot
options:
  bundleIdPrefix: com.macshot
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: ""
targets:
  MacShot:
    type: application
    platform: macOS
    sources:
      - path: MacShot
        excludes:
          - "**/*.md"
    settings:
      PRODUCT_NAME: MacShot
      PRODUCT_BUNDLE_IDENTIFIER: com.macshot.MacShot
      INFOPLIST_FILE: MacShot/Info.plist
      CODE_SIGN_ENTITLEMENTS: MacShot/MacShot.entitlements
      ENABLE_HARDENED_RUNTIME: YES
      CODE_SIGN_STYLE: Automatic
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      COMBINE_HIDPI_IMAGES: YES
      CURRENT_PROJECT_VERSION: 1
      MARKETING_VERSION: 0.1.0
    scheme:
      gatherCoverageData: false
      testTargets: []
