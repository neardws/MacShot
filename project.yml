name: Octoshot
options:
  bundleIdPrefix: com.neardws
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en
  knownRegions:
    - en
    - Base
    - zh-Hans
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: YNQ2233752
    CODE_SIGN_STYLE: Automatic
targets:
  OctoshotCore:
    type: framework
    platform: macOS
    sources:
      - path: OctoshotCore
    settings:
      PRODUCT_NAME: OctoshotCore
      PRODUCT_BUNDLE_IDENTIFIER: com.neardws.OctoshotCore
      GENERATE_INFOPLIST_FILE: YES
      DEFINES_MODULE: YES
      MACH_O_TYPE: staticlib
      SKIP_INSTALL: YES

  octoshot:
    type: tool
    platform: macOS
    sources:
      - path: octoshot-cli
    dependencies:
      - target: OctoshotCore
    settings:
      PRODUCT_NAME: octoshot
      PRODUCT_BUNDLE_IDENTIFIER: com.neardws.octoshot-cli
      GENERATE_INFOPLIST_FILE: YES
      LD_RUNPATH_SEARCH_PATHS:
        - $(inherited)
        - "@executable_path"
        - "@executable_path/../Frameworks"
        - "@executable_path/.."
        - "@loader_path"
        - "@loader_path/../Frameworks"

  Octoshot:
    type: application
    platform: macOS
    sources:
      - path: Octoshot
        excludes:
          - "**/*.md"
    dependencies:
      - target: OctoshotCore
    postBuildScripts:
      - name: Embed octoshot CLI in app bundle
        script: |
          set -euo pipefail
          CLI_SRC="${BUILT_PRODUCTS_DIR}/octoshot"
          if [ ! -f "$CLI_SRC" ] && [ -f "${PROJECT_DIR}/build/Debug/octoshot" ]; then
            CLI_SRC="${PROJECT_DIR}/build/Debug/octoshot"
          fi
          HELPERS_DIR="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers"
          CLI_DST="${HELPERS_DIR}/octoshot"
          if [ ! -f "$CLI_SRC" ]; then
            echo "error: octoshot binary not found at ${BUILT_PRODUCTS_DIR}/octoshot (build the octoshot target first)"
            exit 1
          fi
          mkdir -p "$HELPERS_DIR"
          cp "$CLI_SRC" "$CLI_DST"
          chmod +x "$CLI_DST"
        basedOnDependencyAnalysis: false
    settings:
      PRODUCT_NAME: Octoshot
      PRODUCT_BUNDLE_IDENTIFIER: com.neardws.Octoshot
      INFOPLIST_FILE: Octoshot/Info.plist
      CODE_SIGN_ENTITLEMENTS: Octoshot/Octoshot.entitlements
      ENABLE_HARDENED_RUNTIME: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      COMBINE_HIDPI_IMAGES: YES
      CURRENT_PROJECT_VERSION: 1
      MARKETING_VERSION: 0.1.0
      LD_RUNPATH_SEARCH_PATHS:
        - $(inherited)
        - "@executable_path/../Frameworks"

schemes:
  Octoshot:
    build:
      parallelizeBuild: false
      targets:
        octoshot: build
        Octoshot: all
    run:
      config: Debug
    archive:
      config: Release
  octoshot:
    build:
      targets:
        octoshot: all
    run:
      config: Debug
