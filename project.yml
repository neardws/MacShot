name: Octoshot
options:
  bundleIdPrefix: com.neardws
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en
  knownRegions:
    - en
    - Base
    - zh-Hans
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: ""
targets:
  Octoshot:
    type: application
    platform: macOS
    sources:
      - path: Octoshot
        excludes:
          - "**/*.md"
    settings:
      PRODUCT_NAME: Octoshot
      PRODUCT_BUNDLE_IDENTIFIER: com.neardws.Octoshot
      INFOPLIST_FILE: Octoshot/Info.plist
      CODE_SIGN_ENTITLEMENTS: Octoshot/Octoshot.entitlements
      ENABLE_HARDENED_RUNTIME: YES
      CODE_SIGN_STYLE: Automatic
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      COMBINE_HIDPI_IMAGES: YES
      CURRENT_PROJECT_VERSION: 1
      MARKETING_VERSION: 0.1.0
    scheme:
      gatherCoverageData: false
      testTargets: []
